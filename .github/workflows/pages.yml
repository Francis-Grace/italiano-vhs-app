# Prüft die Inhalte und veröffentlicht die App auf GitHub Pages.
name: Prüfen & veröffentlichen

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Inhalte prüfen
        run: node scripts/validate.mjs
      - name: Seite zusammenstellen
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js data fonts icons _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
      - id: deployment
        uses: actions/deploy-pages@v5
